name: Posting Desk action
# Dispatched by the instructor's Posting Desk panel (or manually from the
# Actions tab). Applies one mechanical post/unpost via scripts/desk_action.py,
# commits to main, and kicks the site build (a GITHUB_TOKEN push does not
# trigger the push workflow by itself).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "post-notes or unpost-notes"
        required: true
        type: choice
        options: [post-notes, unpost-notes]
      key:
        description: "topic xml:id, e.g. section-conics"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: posting-desk
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DESK_ACTION: ${{ inputs.action }}
      DESK_KEY: ${{ inputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Apply the action
        run: python3 scripts/desk_action.py "$DESK_ACTION" "$DESK_KEY"

      - name: Commit and rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "posting-desk"
          git config user.email "posting-desk@users.noreply.github.com"
          git add source
          if git diff --cached --quiet; then
            echo "Repository already in the requested state; nothing to commit."
          else
            git commit -m "Desk: $DESK_ACTION $DESK_KEY"
            git push
            gh workflow run pretext-deploy.yml --ref main
          fi
