<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The directional derivative as |grad f| cos(theta)</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { width: 100%; box-sizing: border-box; }
  #controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 8px 10px; box-sizing: border-box;
  }
  button {
    font-size: 14px; padding: 5px 12px; border-radius: 6px;
    border: 1px solid #888; background: #f4f4f4; cursor: pointer;
  }
  button:hover { background: #e6e6e6; }
  button.active { background: #2a6fdb; color: #fff; border-color: #2a6fdb; }
  #readout { font-size: 14px; color: #333; padding: 0 10px 6px 10px; min-height: 1.2em;
    font-variant-numeric: tabular-nums; }
  #canvasWrap { width: 100%; position: relative; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<div id="app">
  <div id="controls">
    <span style="font-size:14px;">Drag u:</span>
    <button id="btnMax">&theta; = 0 (fastest increase)</button>
    <button id="btnMin">&theta; = 180&deg; (fastest decrease)</button>
    <button id="btnZero">&theta; = 90&deg; (no change)</button>
  </div>
  <div id="readout"></div>
  <div id="canvasWrap"><canvas id="cv"></canvas></div>
</div>

<script>
(function () {
  "use strict";
  // palette (same as the sample-graphs interactive)
  var GOLD = "#f2c14e", RED = "#d1362f", GRAY = "#999999",
      BTN_BLUE = "#2a6fdb", GREEN = "#009e73";

  var canvas = document.getElementById("cv"), ctx = canvas.getContext("2d");
  var GRAD_ANG = 25 * Math.PI / 180; // fixed direction of grad f
  var GRAD_MAG = 2;                  // |grad f|
  var thetaU = GRAD_ANG + 60 * Math.PI / 180; // absolute angle of u

  var BB = { xmin: -2.1, xmax: 2.1, ymin: -2.75, ymax: 1.95 };
  function view() {
    var w = canvas.width, h = canvas.height;
    var k = Math.min(w / (BB.xmax - BB.xmin), h / (BB.ymax - BB.ymin));
    return { k: k,
      ox: w / 2 - k * (BB.xmin + BB.xmax) / 2,
      oy: h / 2 + k * (BB.ymin + BB.ymax) / 2 };
  }

  function arrow(v, x0, y0, x1, y1, color, lw, dashed) {
    var ax = v.ox + v.k * x0, ay = v.oy - v.k * y0;
    var bx = v.ox + v.k * x1, by = v.oy - v.k * y1;
    var ang = Math.atan2(by - ay, bx - ax), hl = 10 + lw * 1.5;
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw;
    if (dashed) ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(bx - hl * Math.cos(ang - 0.42), by - hl * Math.sin(ang - 0.42));
    ctx.lineTo(bx - hl * Math.cos(ang + 0.42), by - hl * Math.sin(ang + 0.42));
    ctx.closePath(); ctx.fill();
  }

  function normAngle(a) {
    while (a > Math.PI) a -= 2 * Math.PI;
    while (a < -Math.PI) a += 2 * Math.PI;
    return a;
  }

  function draw() {
    var v = view(), w = canvas.width, h = canvas.height;
    var dpr = window.devicePixelRatio || 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h);
    ctx.font = (13 * dpr) + "px system-ui, sans-serif";

    var theta = normAngle(thetaU - GRAD_ANG); // angle between u and grad f
    var D = GRAD_MAG * Math.cos(theta);

    // unit circle of directions
    ctx.strokeStyle = GRAY; ctx.lineWidth = 1.2 * dpr;
    ctx.setLineDash([6 * dpr, 5 * dpr]);
    ctx.beginPath(); ctx.arc(v.ox, v.oy, v.k, 0, 2 * Math.PI); ctx.stroke();
    ctx.setLineDash([]);

    // directions of zero change (orthogonal to grad f), dotted gray
    var z1 = GRAD_ANG + Math.PI / 2, z2 = GRAD_ANG - Math.PI / 2;
    arrow(v, 0, 0, Math.cos(z1), Math.sin(z1), "#aaaaaa", 1.6 * dpr, true);
    arrow(v, 0, 0, Math.cos(z2), Math.sin(z2), "#aaaaaa", 1.6 * dpr, true);
    ctx.fillStyle = "#888";
    ctx.fillText("Dᵤf = 0", v.ox + v.k * 1.12 * Math.cos(z1) - 26 * dpr,
                 v.oy - v.k * 1.12 * Math.sin(z1));
    ctx.fillText("Dᵤf = 0", v.ox + v.k * 1.12 * Math.cos(z2) - 26 * dpr,
                 v.oy - v.k * 1.12 * Math.sin(z2) + 10 * dpr);

    // gradient arrow (length 1.55 on screen scale)
    arrow(v, 0, 0, 1.55 * Math.cos(GRAD_ANG), 1.55 * Math.sin(GRAD_ANG), RED, 3.4 * dpr);
    ctx.fillStyle = RED;
    ctx.fillText("∇f", v.ox + v.k * 1.68 * Math.cos(GRAD_ANG),
                 v.oy - v.k * 1.68 * Math.sin(GRAD_ANG));

    // angle arc between grad f and u
    ctx.strokeStyle = "#555"; ctx.lineWidth = 1.4 * dpr;
    ctx.beginPath();
    ctx.arc(v.ox, v.oy, v.k * 0.38, -GRAD_ANG, -thetaU, theta > 0);
    ctx.stroke();
    var mid = GRAD_ANG + theta / 2;
    ctx.fillStyle = "#555";
    ctx.fillText("θ", v.ox + v.k * 0.52 * Math.cos(mid) - 4 * dpr,
                 v.oy - v.k * 0.52 * Math.sin(mid) + 4 * dpr);

    // u arrow (blue, draggable)
    arrow(v, 0, 0, Math.cos(thetaU), Math.sin(thetaU), BTN_BLUE, 3.4 * dpr);
    ctx.fillStyle = BTN_BLUE;
    ctx.fillText("u", v.ox + v.k * 1.14 * Math.cos(thetaU) - 4 * dpr,
                 v.oy - v.k * 1.14 * Math.sin(thetaU) + 4 * dpr);

    // base point
    ctx.fillStyle = "#222";
    ctx.beginPath(); ctx.arc(v.ox, v.oy, 3.5 * dpr, 0, 2 * Math.PI); ctx.fill();
    ctx.fillText("P₀", v.ox - 24 * dpr, v.oy + 16 * dpr);

    // ---- meter bar for D_u f = |grad f| cos(theta) ----
    var bx0 = v.ox - v.k * 1.6, bx1 = v.ox + v.k * 1.6;
    var by = v.oy + v.k * 2.15, bh = v.k * 0.28;
    ctx.strokeStyle = "#888"; ctx.lineWidth = 1.2 * dpr;
    ctx.strokeRect(bx0, by - bh / 2, bx1 - bx0, bh);
    // center tick
    ctx.beginPath();
    ctx.moveTo((bx0 + bx1) / 2, by - bh / 2 - 4 * dpr);
    ctx.lineTo((bx0 + bx1) / 2, by + bh / 2 + 4 * dpr);
    ctx.stroke();
    // fill from center
    var frac = D / GRAD_MAG; // in [-1, 1]
    var cx = (bx0 + bx1) / 2;
    ctx.fillStyle = frac >= 0 ? GREEN : RED;
    if (Math.abs(frac) < 0.005) ctx.fillStyle = GOLD;
    ctx.globalAlpha = 0.75;
    ctx.fillRect(Math.min(cx, cx + frac * (bx1 - bx0) / 2), by - bh / 2,
                 Math.abs(frac) * (bx1 - bx0) / 2, bh);
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#555";
    ctx.fillText("−|∇f|", bx0 - 6 * dpr, by + bh / 2 + 16 * dpr);
    ctx.fillText("0", cx - 3 * dpr, by + bh / 2 + 16 * dpr);
    ctx.fillText("|∇f|", bx1 - 10 * dpr, by + bh / 2 + 16 * dpr);
    ctx.fillText("Dᵤf", bx0 - 6 * dpr, by - bh / 2 - 8 * dpr);
  }

  function update() {
    var theta = Math.abs(normAngle(thetaU - GRAD_ANG));
    var D = GRAD_MAG * Math.cos(theta);
    var note = "";
    if (Math.abs(D - GRAD_MAG) < 0.01) note = "  (maximum: u ∥ ∇f)";
    else if (Math.abs(D + GRAD_MAG) < 0.01) note = "  (minimum: u ∥ −∇f)";
    else if (Math.abs(D) < 0.01) note = "  (no change: u ⊥ ∇f)";
    document.getElementById("readout").textContent =
      "θ = " + (theta * 180 / Math.PI).toFixed(0) + "°:   " +
      "Dᵤf = |∇f| cos θ = " + GRAD_MAG + " × " + Math.cos(theta).toFixed(3) +
      " = " + D.toFixed(2) + note;
    draw();
  }

  // dragging: pointer sets the angle of u
  var dragging = false;
  function setFromPointer(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var v = view();
    var x = (clientX - rect.left) * dpr - v.ox;
    var y = v.oy - (clientY - rect.top) * dpr;
    if (x * x + y * y > 1e-6) { thetaU = Math.atan2(y, x); update(); }
  }
  canvas.addEventListener("mousedown", function (e) { dragging = true; setFromPointer(e.clientX, e.clientY); });
  window.addEventListener("mousemove", function (e) { if (dragging) setFromPointer(e.clientX, e.clientY); });
  window.addEventListener("mouseup", function () { dragging = false; });
  canvas.addEventListener("touchstart", function (e) {
    if (e.touches.length === 1) { dragging = true;
      setFromPointer(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
  }, { passive: false });
  canvas.addEventListener("touchmove", function (e) {
    if (dragging && e.touches.length === 1) {
      setFromPointer(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
  }, { passive: false });
  window.addEventListener("touchend", function () { dragging = false; });

  // buttons
  document.getElementById("btnMax").addEventListener("click", function () {
    thetaU = GRAD_ANG; update();
  });
  document.getElementById("btnMin").addEventListener("click", function () {
    thetaU = GRAD_ANG + Math.PI; update();
  });
  document.getElementById("btnZero").addEventListener("click", function () {
    thetaU = GRAD_ANG + Math.PI / 2; update();
  });

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    var w = document.getElementById("app").clientWidth;
    var used = document.getElementById("controls").offsetHeight +
               document.getElementById("readout").offsetHeight;
    var h = Math.max(260, window.innerHeight - used - 4);
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    update();
  }
  window.addEventListener("resize", resize);
  resize();
})();
</script>
</body>
</html>
