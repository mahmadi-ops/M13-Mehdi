<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Slicing x&#178;+y&#178;&#8722;z&#178;=1: hyperboloid of one sheet</title>
<style>
  html,body{margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#ffffff;color:#1a1a1a;}
  #app{padding:8px;box-sizing:border-box;}
  #controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  button{font-size:13px;padding:6px 12px;border:1px solid #b8b6ad;border-radius:8px;background:#fff;cursor:pointer;}
  button:hover{background:#f1efe8;}
  button.active{border-color:#185FA5;background:#E6F1FB;color:#0C447C;}
  input[type=range]{flex:1;min-width:120px;}
  #wrap{width:100%;height:400px;position:relative;border:1px solid #d3d1c7;border-radius:10px;overflow:hidden;touch-action:none;cursor:grab;}
  #info{margin-top:8px;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace;min-height:22px;}
  #hint{margin-top:2px;font-size:12px;color:#888780;}
  #cv{font-size:13px;font-weight:600;min-width:44px;font-family:ui-monospace,Menlo,Consolas,monospace;}
  label{font-size:13px;color:#5f5e5a;}
</style>
</head>
<body>
<div id="app">
  <div id="controls">
    <button id="bz" class="active">Slice z = c</button>
    <button id="bx">Slice x = c</button>
    <button id="by">Slice y = c</button>
    <button id="bp" aria-label="Pause" style="width:40px;">&#10074;&#10074;</button>
    <label for="cs">c</label>
    <input type="range" id="cs" min="-1.7" max="1.7" step="0.05" value="0" />
    <span id="cv">0.00</span>
  </div>
  <div id="wrap"></div>
  <div id="info"></div>
  <div id="hint">Drag to rotate &middot; scroll to zoom &middot; buttons pick a slicing direction (autoplay tours all three)</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var wrap=document.getElementById('wrap'),info=document.getElementById('info'),slider=document.getElementById('cs'),cval=document.getElementById('cv');
var H=400;
var scene=new THREE.Scene();
scene.background=new THREE.Color(0xffffff);
var camera=new THREE.PerspectiveCamera(45,wrap.clientWidth/H,0.1,100);
var sph={r:8.5,phi:1.15,theta:0.65};
function updateCam(){camera.position.set(sph.r*Math.sin(sph.phi)*Math.cos(sph.theta),sph.r*Math.cos(sph.phi),sph.r*Math.sin(sph.phi)*Math.sin(sph.theta));camera.lookAt(0,0,0);}
updateCam();
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(window.devicePixelRatio||1);
renderer.setSize(wrap.clientWidth,H);
wrap.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.85));
var dl=new THREE.DirectionalLight(0xffffff,0.5);dl.position.set(4,6,3);scene.add(dl);
var zMax=1.6;
function rad(z){return Math.sqrt(1+z*z);}
(function surface(){
 var rings=40,radial=72,pos=[],idx=[];
 for(var i=0;i<=rings;i++){var z=-zMax+2*zMax*i/rings,r=rad(z);
  for(var j=0;j<=radial;j++){var th=2*Math.PI*j/radial;pos.push(r*Math.cos(th),z,r*Math.sin(th));}}
 for(var i2=0;i2<rings;i2++)for(var j2=0;j2<radial;j2++){var a=i2*(radial+1)+j2,b=a+1,c2=a+radial+1,d=c2+1;idx.push(a,c2,b,b,c2,d);}
 var g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
 scene.add(new THREE.Mesh(g,new THREE.MeshPhongMaterial({color:0x7F77DD,transparent:true,opacity:0.30,side:THREE.DoubleSide,depthWrite:false})));
})();
var gridMat=new THREE.LineBasicMaterial({color:0x888780,transparent:true,opacity:0.45});
for(var zi=-4;zi<=4;zi++){var z=zi*0.4,r=rad(z),pts=[];
 for(var j=0;j<=72;j++){var th=2*Math.PI*j/72;pts.push(new THREE.Vector3(r*Math.cos(th),z,r*Math.sin(th)));}
 scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),gridMat));}
for(var ai=0;ai<12;ai++){var th2=Math.PI*ai/6,pts2=[];
 for(var k=0;k<=32;k++){var z2=-zMax+2*zMax*k/32,r2=rad(z2);pts2.push(new THREE.Vector3(r2*Math.cos(th2),z2,r2*Math.sin(th2)));}
 scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts2),gridMat));}
var axMat=new THREE.LineBasicMaterial({color:0x888780,transparent:true,opacity:0.8});
function axis(a,b){scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),axMat));}
axis(new THREE.Vector3(-2.6,0,0),new THREE.Vector3(2.6,0,0));
axis(new THREE.Vector3(0,-2.2,0),new THREE.Vector3(0,2.2,0));
axis(new THREE.Vector3(0,0,-2.6),new THREE.Vector3(0,0,2.6));
function label(txt,p){var cv2=document.createElement('canvas');cv2.width=cv2.height=64;var ctx=cv2.getContext('2d');ctx.font='italic 44px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#5f5e5a';ctx.fillText(txt,32,34);
 var s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv2),transparent:true}));s.position.copy(p);s.scale.set(0.42,0.42,1);scene.add(s);}
label('x',new THREE.Vector3(2.85,0,0));label('z',new THREE.Vector3(0,2.45,0));label('y',new THREE.Vector3(0,0,2.85));
var plane=new THREE.Mesh(new THREE.PlaneGeometry(5,5),new THREE.MeshBasicMaterial({color:0x378ADD,transparent:true,opacity:0.13,side:THREE.DoubleSide,depthWrite:false}));
plane.add(new THREE.LineSegments(new THREE.EdgesGeometry(plane.geometry),new THREE.LineBasicMaterial({color:0x378ADD,transparent:true,opacity:0.6})));
scene.add(plane);
var traceGroup=new THREE.Group();scene.add(traceGroup);
var traceMat=new THREE.MeshBasicMaterial({color:0xD85A30});
function clearTrace(){while(traceGroup.children.length){var m=traceGroup.children.pop();m.geometry.dispose();}}
function addTube(pts,closed){var curve=new THREE.CatmullRomCurve3(pts,!!closed);traceGroup.add(new THREE.Mesh(new THREE.TubeGeometry(curve,100,0.035,8,!!closed),traceMat));}
function mk(mode,c,w,z){return mode==='x'?new THREE.Vector3(c,z,w):new THREE.Vector3(w,z,c);}
function buildTrace(mode,c){
 clearTrace();
 if(mode==='z'){if(Math.abs(c)>zMax+1e-3)return;var r=Math.sqrt(1+c*c),pts=[];
  for(var j=0;j<96;j++){var th=2*Math.PI*j/96;pts.push(new THREE.Vector3(r*Math.cos(th),c,r*Math.sin(th)));}
  addTube(pts,true);return;}
 var k2=1-c*c,N=48,s,j2,pts2,t;
 if(Math.abs(k2)<0.04){for(s=1;s>=-1;s-=2){pts2=[];for(j2=0;j2<=N;j2++){var z=-zMax+2*zMax*j2/N;pts2.push(mk(mode,c,s*z,z));}addTube(pts2);}}
 else if(k2>0){var kk=Math.sqrt(k2),tM=Math.asinh(zMax/kk);
  for(s=1;s>=-1;s-=2){pts2=[];for(j2=0;j2<=N;j2++){t=-tM+2*tM*j2/N;pts2.push(mk(mode,c,s*kk*Math.cosh(t),kk*Math.sinh(t)));}addTube(pts2);}}
 else{var k3=Math.sqrt(-k2);if(k3>=zMax)return;var tM2=Math.acosh(zMax/k3);
  for(s=1;s>=-1;s-=2){pts2=[];for(j2=0;j2<=N;j2++){t=-tM2+2*tM2*j2/N;pts2.push(mk(mode,c,k3*Math.sinh(t),s*k3*Math.cosh(t)));}addTube(pts2);}}}
function placePlane(mode,c){
 if(mode==='z'){plane.rotation.set(-Math.PI/2,0,0);plane.position.set(0,c,0);}
 else if(mode==='x'){plane.rotation.set(0,Math.PI/2,0);plane.position.set(c,0,0);}
 else{plane.rotation.set(0,0,0);plane.position.set(0,0,c);}}
function infoText(mode,c){
 var cs=c.toFixed(2);
 if(mode==='z')return 'z = '+cs+' :  x² + y² = 1 + c² = '+(1+c*c).toFixed(2)+'  →  circle, radius '+Math.sqrt(1+c*c).toFixed(2);
 var o=mode==='x'?'y':'x',k2=1-c*c;
 if(Math.abs(k2)<0.04)return mode+' = '+cs+' :  '+o+'² = z²  →  two crossing lines (transition at c = ±1)';
 if(k2>0)return mode+' = '+cs+' :  '+o+'² − z² = '+k2.toFixed(2)+'  →  hyperbola opening along '+o;
 return mode+' = '+cs+' :  z² − '+o+'² = '+(-k2).toFixed(2)+'  →  hyperbola opening along z';}
var mode='z',playing=true,tour=true,phase=2250,last=null,c=0,lastKey='';
var DUR=9000,order=['z','x','y'];
function amp(m){return m==='z'?1.55:1.7;}
var btns={z:document.getElementById('bz'),x:document.getElementById('bx'),y:document.getElementById('by')};
function syncButtons(){for(var m in btns){btns[m].className=(m===mode)?'active':'';}}
for(var m2 in btns)(function(m){btns[m].addEventListener('click',function(){mode=m;tour=false;phase=0;syncButtons();});})(m2);
var bp=document.getElementById('bp');
bp.addEventListener('click',function(){playing=!playing;bp.innerHTML=playing?'❚❚':'▶';bp.setAttribute('aria-label',playing?'Pause':'Play');});
slider.addEventListener('input',function(){playing=false;bp.innerHTML='▶';c=parseFloat(slider.value);});
var drag=null;
wrap.addEventListener('pointerdown',function(e){drag={x:e.clientX,y:e.clientY};wrap.setPointerCapture(e.pointerId);wrap.style.cursor='grabbing';});
wrap.addEventListener('pointermove',function(e){if(!drag)return;sph.theta+=(e.clientX-drag.x)*0.008;sph.phi=Math.min(2.9,Math.max(0.25,sph.phi-(e.clientY-drag.y)*0.008));drag={x:e.clientX,y:e.clientY};updateCam();});
wrap.addEventListener('pointerup',function(){drag=null;wrap.style.cursor='grab';});
wrap.addEventListener('wheel',function(e){e.preventDefault();sph.r=Math.min(20,Math.max(4,sph.r+e.deltaY*0.01));updateCam();},{passive:false});
window.addEventListener('resize',function(){camera.aspect=wrap.clientWidth/H;camera.updateProjectionMatrix();renderer.setSize(wrap.clientWidth,H);});
function frame(now){
 requestAnimationFrame(frame);
 if(last===null)last=now;
 var dt=now-last;last=now;
 if(playing){phase+=dt;
  if(phase>DUR){phase-=DUR;if(tour){mode=order[(order.indexOf(mode)+1)%3];syncButtons();}}
  c=amp(mode)*Math.sin(2*Math.PI*phase/DUR);
  slider.value=c;}
 var key=mode+':'+c.toFixed(3);
 if(key!==lastKey){lastKey=key;buildTrace(mode,c);placePlane(mode,c);info.textContent=infoText(mode,c);cval.textContent=c.toFixed(2);}
 renderer.render(scene,camera);}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
